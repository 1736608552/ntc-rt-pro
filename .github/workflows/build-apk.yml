name: Build NTC R-T Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Sign & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            ls -lh app/release.keystore
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret not found"
            exit 1
          fi

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Release Signature & Prepare Assets
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          rm -f app/release.keystore
          mkdir -p release-apks
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_SRC" release-apks/NTC-RT-Pro-v1.3.0.apk

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs release-apks/NTC-RT-Pro-v1.3.0.apk
          fi

          export APK_SIZE=$(stat -c%s release-apks/NTC-RT-Pro-v1.3.0.apk)
          export PUB_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python3 -c '
          import json, os
          repo = os.environ["GITHUB_REPO"]
          data = {
              "versionCode": 4,
              "versionName": "1.3.0",
              "apkName": "NTC-RT-Pro-v1.3.0.apk",
              "apkSize": int(os.environ["APK_SIZE"]),
              "downloadUrl": f"https://github.com/{repo}/releases/download/v1.3.0/NTC-RT-Pro-v1.3.0.apk",
              "publishedAt": os.environ["PUB_AT"],
              "releaseNotes": "1. 新增阻值正负公差 (阻值+ / 阻值-) 与 B值正负公差 (B+ / B-) 四个独立输入框；\n2. 严格按非对称四向公差角点计算全温区上下限与温度误差带；\n3. 曲线档案与历史记录全面兼容非对称正负公差显示与保存。"
          }
          with open("release-apks/version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          '
          cat release-apks/version.json
          ls -lh release-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTC-RT-Pro-APK-v1.3.0
          path: release-apks/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "NTC R-T Pro v1.3.0 — 非对称正负公差独立输入版"
          body: |
            ### 🔬 NTC R-T Pro v1.3.0

            #### ✨ 本版升级特性
            1. **B 值与阻值正负公差全部独立输入**：
               - 主界面直接提供 **`阻值+(%)`**、**`阻值-(%)`**、**`B+(%)`**、**`B-(%)`** 四个独立输入框（高级调参弹窗同步支持）；
               - 非对称正负公差实时参与全温区阻值上下限包络及反推温度误差窗口计算，填入即生效，填 `0` 即不叠加。
            2. **多 CDN 一键覆盖升级**：
               - 与 `v1.1.0`/`v1.2.0` 共用同一正式 Release Keystore 签名，直接在 App 内点版本徽章即可在线升级。

            #### 📥 安装使用
            - 如已安装 `v1.1.0`/`v1.2.0`，可在 App 内直接在线更新至 `v1.3.0`，或下载下方 **`NTC-RT-Pro-v1.3.0.apk`** 覆盖安装。
          files: release-apks/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
