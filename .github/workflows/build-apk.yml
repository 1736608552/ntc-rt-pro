name: Build NTC R-T Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Sign & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            ls -lh app/release.keystore
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret not found"
            exit 1
          fi

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Release Signature & Prepare Assets
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          rm -f app/release.keystore
          mkdir -p release-apks
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_SRC" release-apks/NTC-RT-Pro-v1.4.0.apk

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs release-apks/NTC-RT-Pro-v1.4.0.apk
          fi

          export APK_SIZE=$(stat -c%s release-apks/NTC-RT-Pro-v1.4.0.apk)
          export PUB_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python3 -c '
          import json, os
          repo = os.environ["GITHUB_REPO"]
          data = {
              "versionCode": 5,
              "versionName": "1.4.0",
              "apkName": "NTC-RT-Pro-v1.4.0.apk",
              "apkSize": int(os.environ["APK_SIZE"]),
              "downloadUrl": f"https://github.com/{repo}/releases/download/v1.4.0/NTC-RT-Pro-v1.4.0.apk",
              "publishedAt": os.environ["PUB_AT"],
              "releaseNotes": "1. 全面融合 NTC 银面与边长计算器（新增第 4 工作台「银面尺寸」）；\n2. 新增原生动态几何比例蓝图（随输入尺寸实时缩放，支持圆片⇄圆片与圆片⇄方片）；\n3. 保留 4 填 3 翡翠绿自动回填与 4 项误差校验，支持本地记忆与一键将目标阻值送入曲线 R25；\n4. 正式签名支持 App 内多 CDN 在线一键升级。"
          }
          with open("release-apks/version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          '
          cat release-apks/version.json
          ls -lh release-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTC-RT-Pro-APK-v1.4.0
          path: release-apks/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.0
          name: "NTC R-T Pro v1.4.0 — 全能融合版（R-T特性曲线 + 银面尺寸计算）"
          body: |
            ### 🔬 NTC R-T Pro v1.4.0

            #### ✨ 本版重大融合升级
            1. **新增第 4 工作台「📐 银面尺寸」（融合 wire-calc-app）**：
               - 支持 **`⚪ 圆片 ⇄ 圆片`** ($R_1 r_1^2 = R_2 r_2^2$) 与 **`⬜ 圆片 ⇄ 方片`** ($a = \sqrt{R_1 \pi r_1^2 / R_2}$) 双模式；
               - **动态几何比例蓝图**：实时绘制原始圆片与目标圆/方片并随输入比例缩放、标明直径/半径/边长标尺防填错；
               - **4 填 3 自动感应回填**：任意填 3 项，留空项自动计算并以翡翠绿高亮显示；填满 4 项自动校验相对误差 `%`；
               - **一键联动曲线**：支持点击 **`用 R₂ 画 R-T 曲线`** 将算出的阻值直接送入特性曲线工作台。
            2. **多 CDN 一键覆盖升级**：
               - 与 `v1.1.0`/`v1.2.0`/`v1.3.0` 使用同一正式 Release Keystore 签名，直接在 App 内点版本徽章即可在线升级。

            #### 📥 安装使用
            - 已安装旧版（v1.1.0+）可在 App 内直接在线更新至 `v1.4.0`，或下载下方 **`NTC-RT-Pro-v1.4.0.apk`** 覆盖安装。
          files: release-apks/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
