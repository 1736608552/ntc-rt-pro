name: Build NTC R-T Pro APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, Sign & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Decode Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            ls -lh app/release.keystore
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret not found"
            exit 1
          fi

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify Release Signature & Prepare Assets
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          rm -f app/release.keystore
          mkdir -p release-apks
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_SRC" release-apks/NTC-RT-Pro-v1.2.0.apk

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs release-apks/NTC-RT-Pro-v1.2.0.apk
          fi

          export APK_SIZE=$(stat -c%s release-apks/NTC-RT-Pro-v1.2.0.apk)
          export PUB_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python3 -c '
          import json, os
          repo = os.environ["GITHUB_REPO"]
          data = {
              "versionCode": 3,
              "versionName": "1.2.0",
              "apkName": "NTC-RT-Pro-v1.2.0.apk",
              "apkSize": int(os.environ["APK_SIZE"]),
              "downloadUrl": f"https://github.com/{repo}/releases/download/v1.2.0/NTC-RT-Pro-v1.2.0.apk",
              "publishedAt": os.environ["PUB_AT"],
              "releaseNotes": "1. 移除所有内置对比预设选项，新增「存曲线」与本地计算档案库；\n2. 自动保存最近计算历史，支持将之前算过的任意曲线一键设为对比或重新载入；\n3. 支持在对比窗口直接输入自定义 R25 与 B 值临时对比；\n4. 支持多 CDN 在线一键升级。"
          }
          with open("release-apks/version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          '
          cat release-apks/version.json
          ls -lh release-apks/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTC-RT-Pro-APK-v1.2.0
          path: release-apks/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "NTC R-T Pro v1.2.0 — 历史计算存档与自由对比版"
          body: |
            ### 🔬 NTC R-T Pro v1.2.0

            #### ✨ 本版升级亮点
            1. **计算结果可保存 & 历史档案对比**：
               - 移除内置固定 B 值对比列表，曲线下方新增 **`存曲线`** 按钮，可随时命名保存当前算出的曲线参数；
               - 自动记忆最近计算快照（`[历史]`），点开 **`对比`** 即可把以前算出的任意曲线设为对比（洋红虚线）或重新载入编辑；
               - 对比窗口内也支持直接输入任意临时 `R25` 和 `B` 值进行对比。
            2. **正式签名 + 多 CDN 在线更新**：
               - 与 `v1.1.0` 使用同一正式 Release Keystore 签名，支持 App 内点击版本徽章直接在线覆盖安装！

            #### 📥 安装使用
            - 如已安装 `v1.1.0`，可在 App 内直接点左上角 **`v1.1.0`** 通过多 CDN 加速在线更新至 `v1.2.0`，或下载下方 **`NTC-RT-Pro-v1.2.0.apk`** 覆盖安装。
          files: release-apks/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
